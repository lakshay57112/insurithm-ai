[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurithm-ai"
version = "0.1.0"
description = "Insurithm: an evidence-grounded agentic AI system for health insurance appeals"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.5",
    "mcp>=1.10,<2",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insurithm = ["web/*.html", "web/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
